<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <main class="container">
      <h1>Productos</h1>
      <ul class="grid" role="list">
        <li class="card grid__item">
          <img class="card__media" src="https://picsum.photos/seed/lamp/800/600" alt="Lámpara de mesa" loading="lazy">
          <div class="card__body">
            <h2 class="card__title">Lámpara de mesa</h2>
            <p class="card__text">Luz cálida regulable, base de roble.</p>
            <p class="card__price">49 €</p>
            <a class="btn card__action" href="#comprar">Comprar</a>
          </div>
        </li>
        <li class="card card--featured grid__item">
          <img class="card__media" src="https://picsum.photos/seed/chair/800/600" alt="Silla nórdica" loading="lazy">
          <div class="card__body">
            <h2 class="card__title">Silla nórdica</h2>
            <p class="card__text">Destacado del mes.</p>
            <p class="card__price">89 €</p>
            <a class="btn btn--secondary card__action" href="#comprar">Comprar</a>
          </div>
        </li>
      </ul>
    </main>
  </body>
</html>
